name: Python CI
run-name: "Python CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
      - '**'  # Triggers on push to any branch
  pull_request:
    branches:
      - '**' # Triggers on PR creation, updates, or reopening against any branch

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.2'

    - name: Install dependencies
      run: |
        cd software/python
        pip install -e .

    - name: Install linters and formatters
      run: |
        pip install black==24.10.0 flake8==7.0.0

    - name: Run Black formatter
      run: |
        cd software/python
        black --check --skip-magic-trailing-comma .

    - name: Run tests
      run: |
        cd software/python
        pip install pytest==8.1.1 pytest-cov==5.0.0
        python3 -m pytest -v --cov --disable-warnings tests/
        flake8 --statistics
